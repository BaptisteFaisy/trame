name: CI

# CI de l'app Forge « Trame » : types, tests unitaires, gardes de taille
# (fichier < 500 lignes), manifeste Forge, site public (tolérant tant que
# site/src est absent), sanity docs, tests des gardes CI et syntaxe shell.
# Le check publié s'appelle `ci` (c'est le nom du job qui nomme le check) :
# il est exigé par le ruleset de `main` et par la file Mergify, comme
# `ci-budget` et `couche0`.
#
# Budget : 5 minutes maximum (règle CI du 24 octobre 2026,
# ~/Bureau/CI-BUDGET-5MIN.md). Le runner est persistant : `node_modules` est
# conservé d'un run à l'autre et l'installation n'a lieu que si
# `package-lock.json` a changé. Jamais de timeout allongé : on optimise ou on
# découpe.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false  # un check requis annulé bloque la file (leçon du 11 nov.)

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, trame-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Runner self-hosted persistant : on garde `node_modules` (l'app
      # TypeScript), on jette le reste. `git clean -ffdx` sans `-e` effacerait
      # les dépendances et ferait exploser le budget de 5 minutes.
      - name: Nettoyage du workspace (node_modules conservé)
        shell: bash
        run: git clean -ffdx -e /node_modules -e /.npm-state

      - name: Dépendances (magasin chaud, installation seulement si le lock change)
        shell: bash
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          export NPM_CONFIG_CACHE="$HOME/.npm-ci-cache"
          LOCK_HASH="$(sha256sum package-lock.json | cut -d' ' -f1)"
          # Le marqueur vit DANS node_modules : `npm ci` efface ce dossier, donc
          # le marqueur disparaît exactement quand l'installation est invalidée,
          # et `git clean -e /node_modules` le conserve d'un run à l'autre.
          MARKER="node_modules/.trame-lock-hash"
          STORE="$HOME/.trame-ci-deps/$LOCK_HASH"
          if [ -d node_modules ] && [ "$LOCK_HASH" = "$(cat "$MARKER" 2>/dev/null)" ]; then
            echo "node_modules deja a jour - installation sautee"
          elif [ -d "$STORE/node_modules" ]; then
            # Magasin chaud du runner : copie par liens durs, quelques secondes.
            rm -rf node_modules
            cp -al "$STORE/node_modules" node_modules
            printf '%s' "$LOCK_HASH" > "$MARKER"
            echo "node_modules copie depuis le magasin $STORE"
          else
            echo "installation des dependances (a froid)..."
            npm ci --prefer-offline --no-audit --no-fund
            printf '%s' "$LOCK_HASH" > "$MARKER"
            # On alimente le magasin pour les runs suivants de ce runner.
            mkdir -p "$STORE" && rm -rf "$STORE/node_modules" \
              && cp -al node_modules "$STORE/node_modules" \
              && echo "magasin alimente : $STORE"
          fi

      - name: Types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests unitaires (vitest)
        run: npx vitest run --passWithNoTests

      # Garde user (règle de fin octobre) : aucun fichier au-delà de 500 lignes.
      - name: Garde de taille des fichiers (< 500 lignes)
        run: python3 tools/check-file-limits.py

      - name: Workflows GitHub valides (YAML)
        run: python3 tools/check-workflows-yaml.py

      # Le manifeste Forge est outillé : l'étape reste tolérante (message +
      # code 0) tant que tools/check-manifest.mjs est absent.
      - name: Manifeste Forge (absent toléré)
        shell: bash
        run: |
          if [ -f tools/check-manifest.mjs ]; then
            node tools/check-manifest.mjs
          else
            echo "::notice::tools/check-manifest.mjs absent - etape ignoree"
          fi

      # Le site public n'existe pas encore (lot L11) : build tolérant.
      - name: Site public (vite build, si présent)
        shell: bash
        run: |
          if [ -d site/src ]; then
            npm run site:build
          else
            echo "::notice::site/src absent - build du site ignore"
          fi

      - name: Sanity docs (UTF-8, non vides)
        run: |
          python3 - <<'EOF'
          import os
          exts = {".md", ".mdx", ".txt"}
          ignores = {".git", "node_modules", "dist", "build", ".npm-state", "coverage"}
          vides, illisibles, total = [], [], 0
          for racine, dossiers, fichiers in os.walk("."):
              dossiers[:] = [d for d in dossiers if d not in ignores]
              for nom in sorted(fichiers):
                  if os.path.splitext(nom)[1].lower() not in exts:
                      continue
                  chemin = os.path.join(racine, nom)
                  total += 1
                  try:
                      with open(chemin, "r", encoding="utf-8") as fh:
                          contenu = fh.read()
                  except (OSError, UnicodeError):
                      illisibles.append(chemin)
                      continue
                  if not contenu.strip():
                      vides.append(chemin)
          print("%d doc(s) controle(s)" % total)
          for chemin in illisibles:
              print("::error::illisible en UTF-8 : %s" % chemin)
          for chemin in vides:
              print("::error::document vide : %s" % chemin)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Les gardes de la CI se testent elles-mêmes : couche0 + agents inferhub
      # + agents fireworks — stdlib, quelques secondes, aucun réseau.
      # `fireworks/test_agent.py` n'est PAS un jeu de tests : c'est le pilote
      # CLI (il exige --repo/--pr/--branch/--sha), exercé par
      # `test_test_agent.py` — d'où son exclusion de la boucle.
      - name: Tests des gardes CI (couche0, inferhub, fireworks)
        shell: bash
        run: |
          python3 .github/couche0/test_check_couche0.py
          for test in .github/inferhub/test_*.py; do
            echo "== $test"
            python3 "$test"
          done
          for test in .github/fireworks/test_*.py; do
            case "$test" in
              */test_agent.py) echo "== $test (pilote CLI, saute)"; continue ;;
            esac
            echo "== $test"
            python3 "$test"
          done

      # Les scripts shell sont vérifiés sans être exécutés (pas de réseau).
      - name: Syntaxe des scripts shell (s'il y en a)
        shell: bash
        run: |
          trouve=0
          while IFS= read -r script; do
            bash -n "$script"
            echo "bash -n OK : $script"
            trouve=1
          done < <(find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*')
          if [ "$trouve" = 0 ]; then
            echo "::notice::aucun script shell - etape ignoree"
          fi
